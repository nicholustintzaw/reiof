on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The runner clock is fine; this check simply cannot reach the remote
      # time service from CI and reports "unable to verify current time".
      _R_CHECK_SYSTEM_CLOCK_: 0

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      # man/ and NAMESPACE are generated from the roxygen comments in R/.
      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Keeps the full check log as a downloadable artifact when a job
          # fails, so a platform-specific failure can actually be read.
          upload-results: true
          # No --compact-vignettes: it shells out to ghostscript and qpdf,
          # which are not installed on every runner, and this package is not
          # CRAN-bound so the size saving is pointless.
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
