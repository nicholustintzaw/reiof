# Builds the pkgdown site and publishes it to GitHub Pages.
#
# WHY THE FIRST RUN FAILED: the repository's Pages source was set to "Deploy
# from a branch". The actions/deploy-pages step only works when the source is
# "GitHub Actions", so the deploy job failed and the published site 404'd.
#
# The configure-pages step below now attempts to switch the source over
# automatically. If it cannot (it needs the repository to allow it), set it by
# hand once:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The site is published at https://nicholustintzaw.github.io/reiof/

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::roxygen2, local::.
          needs: website

      # man/ is generated from the roxygen comments in R/, which are the source
      # of truth. pkgdown reads man/, so this has to run before the site build.
      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Switches the Pages source to "GitHub Actions" if it is not already, and
      # fails with a readable message rather than a bare 404 if it cannot.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
